included:
  - AlertaApp

excluded:
  - BuildTools
  - Kotek/Resources/Assets.xcassets

disabled_rules:

opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - sorted_imports

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

reporter: "xcode"
