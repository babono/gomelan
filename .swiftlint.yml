included:
  - Kotek

excluded:
  - BuildTools
  - Kotek/Resources/Assets.xcassets

# todo: the codebase marks known gaps with TODO on purpose.
# multiple_closures_with_trailing_closure: SwiftUI's own initialisers read this way.
# opening_brace: swiftformat puts the `{` of a multi-line condition on its own line,
# which this rule then flags; the formatter owns brace placement.
disabled_rules:
  - todo
  - opening_brace
  - multiple_closures_with_trailing_closure

# force_unwrapping is not opted in: the DSP/vDSP code unwraps base addresses of
# buffers it has just sized, and a guard on each would only hide that.
opt_in_rules:
  - empty_count
  - explicit_init
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - sorted_imports

# Comments here explain why and run long on purpose (see CLAUDE.md), and the
# lines left over are UI copy and the embedded fallback JSON, which can't wrap.
line_length:
  warning: 340
  error: 500
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 700
  error: 1000

file_length:
  warning: 800
  error: 1500
  ignore_comment_only_lines: true

function_body_length:
  warning: 150
  error: 250

cyclomatic_complexity:
  warning: 25
  error: 30

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 5
  error: 7

nesting:
  type_level: 2

# Single letters are how this codebase writes DSP and geometry (x, y, i, k, W, H),
# and `body_` / `where_` stand in for Swift keywords in decoded field names.
identifier_name:
  min_length:
    warning: 1
  allowed_symbols: ["_"]
  excluded:
    - id
    - W
    - H

# Buttons are components (Kotek/Core/UI/Buttons/), not something a view styles.
# A feature view picks a component and a prominence; the surface, type, size and
# padding belong to the component, so two screens cannot drift apart again.
# `.buttonStyle(.kajar)` is NOT banned: it is the tick alone, for content tiles
# (cards, avatars, key tiles) that are not button chrome.
custom_rules:
  no_view_level_button_surface:
    name: "Button surface outside Core/UI/Buttons"
    included: "Kotek/Features/.*\\.swift"
    regex: '\.(controlSurface|flatGlass|glassEffect)\('
    message: "Use AppButton, AppIconButton, AppChip or AppMenuLabel; do not draw a button surface in a feature view."
    severity: error
  no_plain_button_style:
    name: "Plain button style in a feature view"
    included: "Kotek/Features/.*\\.swift"
    regex: '\.buttonStyle\(\.plain\)'
    message: "A button is an AppButton (it ticks, and looks like the rest). Use AppButton(silent: true) if it must not tick."
    severity: error

reporter: "xcode"
