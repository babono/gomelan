<!doctype html>
<!--
  App Store highlight frames. One template, six frames: open with ?frame=1…6,
  and ?size=ipad for the 13" iPad layout. Rendered by render.sh to
  2868 × 1320 (6.9" iPhone, landscape) and 2752 × 2064 (13" iPad).

  The app's own look (Kotek/Core/UI/Theme.swift, the Nawa Sanga palette):
  Putih ground, Ireng type, Katibeh for the headline, Merah for polos and the
  one accent, SangsihBlue for sangsih, Kuning for a glow. Sentence case
  throughout — the design keeps capitals for the wordmark alone. Edit the
  copy in FRAMES below.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Katibeh"; src: url("../../Kotek/Resources/font/Katibeh-Regular.ttf"); }

  :root {
    --putih: #FBF6EE; --krem: #F5EDE0; --garis: #CDBBA3; --ireng: #1E2435;
    --merah: #E14B2F; --merah-tua: #A93321; --kuning: #F5B331; --sangsih: #2F4B82;
    --description: #6B6E78;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 2868px; height: 1320px; overflow: hidden; background: var(--putih); }
  body {
    position: relative;
    font-family: "SF Pro Rounded", -apple-system, "Helvetica Neue", sans-serif;
    color: var(--ireng);
  }

  /* The launch gate's silhouette reaching in from the left edge, as the
     app's ground has it (PatternBackground). */
  .gate {
    position: absolute; left: -150px; bottom: -40px; height: 1000px; width: 480px;
    /* One beige, not the artwork's colours — a silhouette, as on the app's ground. */
    background: #EFE3D0;
    -webkit-mask: url("../../Kotek/Resources/Assets.xcassets/pura-gate.imageset/pura-gate.svg") 0 100% / contain no-repeat;
  }
  .glow {
    position: absolute; width: 2100px; height: 2100px; right: -420px; top: -380px;
    background: radial-gradient(closest-side, rgba(245, 179, 49, .20), rgba(245, 179, 49, 0));
  }

  .copy {
    position: absolute; left: 230px; top: 0; bottom: 0; width: 820px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker { display: flex; align-items: center; gap: 22px; margin-bottom: 30px; }
  .kicker img { width: 92px; }
  .kicker span { font-size: 40px; font-weight: 700; color: var(--merah); }
  h1 {
    font-family: "Katibeh", serif; font-weight: 400;
    font-size: 148px; line-height: .98; color: var(--ireng);
    margin-bottom: 40px;
  }
  p { font-size: 46px; line-height: 1.38; color: var(--description); }
  p b { color: var(--ireng); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 50px; }
  .chip {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 16px 30px; border-radius: 999px;
    background: #fff; border: 3px solid var(--garis); box-shadow: 0 6px 0 var(--garis);
    font-size: 36px; color: var(--ireng); font-weight: 600;
  }
  .chip i { width: 46px; height: 22px; border-radius: 11px; display: block; }
  .chip span { color: var(--description); font-weight: 400; }

  /* A landscape iPhone, drawn: a dark slab with the screenshot set in at the
     display's own corner radius, the Dynamic Island on the left edge. */
  .device {
    position: absolute; right: 120px; top: 50%; transform: translateY(-50%);
    width: 1700px; padding: 24px; border-radius: 116px;
    background: linear-gradient(145deg, #2a3042, #11141d);
    box-shadow: 0 0 0 3px rgba(30, 36, 53, .25), 0 60px 120px rgba(30, 36, 53, .28), 0 16px 34px rgba(30, 36, 53, .18);
  }
  .device img { display: block; width: 100%; border-radius: 92px; }
  .device::after {
    content: ""; position: absolute; left: 44px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 160px; border-radius: 19px; background: #000;
  }

  /* iPad 13" (2752 × 2064, 4:3): copy on top, the iPad below, landscape. */
  html.ipad, html.ipad body { width: 2752px; height: 2064px; }
  .ipad .copy { left: 220px; right: 220px; top: 150px; bottom: auto; width: auto; display: block; }
  .ipad h1 { font-size: 176px; margin-bottom: 30px; }
  .ipad p { font-size: 52px; max-width: 2150px; }
  .ipad .chips { display: none; }
  .ipad .gate { display: none; }
  .ipad .device {
    right: auto; left: 50%; top: auto; bottom: 110px; transform: translateX(-50%);
    width: 1840px; padding: 44px; border-radius: 92px;
  }
  .ipad .device img { border-radius: 52px; }
  .ipad .device::after { display: none; }
  .ipad .glow { right: -200px; top: 500px; width: 2700px; height: 2700px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="gate"></div>
  <div class="copy" id="copy"></div>
  <div class="device"><img id="shot" alt=""></div>

<script>
const FRAMES = {
  1: {
    kicker: "Free play",
    title: "Your gangsa,<br>guided",
    body: "Notes fall onto the bilah to strike next. Add the strike controller and <b>every hit is scored</b>.",
    shot: "01-play.jpg",
  },
  2: {
    kicker: "Learn",
    title: "One note<br>at a time",
    body: "Kipli teaches each pattern in steps and <b>waits on every note</b> until you strike the bilah that glows.",
    shot: "02-note-by-note.jpg",
  },
  3: {
    kicker: "Kotekan",
    title: "Two halves.<br>One melody.",
    body: "Watch <b>polos</b> and <b>sangsih</b> weave together before you play either half.",
    extra: `<div class="chips">
      <div class="chip"><i style="background:var(--merah)"></i>Polos <span>on the beat</span></div>
      <div class="chip"><i style="background:var(--sangsih)"></i>Sangsih <span>in between</span></div>
    </div>`,
    shot: "03-two-halves.jpg",
  },
  4: {
    kicker: "Build up",
    title: "Slow to<br>full speed",
    body: "Start at half tempo. A clean pass <b>moves you up a step</b>, until the pattern is yours at full speed.",
    shot: "04-build-up.jpg",
  },
  5: {
    kicker: "Kotek Studio",
    title: "Write your<br>own kotekan",
    body: "Draw polos and sangsih on the roll, mark where to damp, and <b>practise it like any other</b>.",
    shot: "05-studio.jpg",
  },
  6: {
    kicker: "Play together",
    title: "Two players,<br>one screen",
    body: "One on polos, one on sangsih. <b>The interlock lights up</b> where your halves meet.",
    shot: "06-coop.jpg",
  },
};

const params = new URLSearchParams(location.search);
const ipad = params.get("size") === "ipad";
if (ipad) document.documentElement.classList.add("ipad");
const f = FRAMES[params.get("frame") || 1];
// One line on iPad. Swapped in the copy rather than hidden in CSS, because a
// hidden <br> takes the word space with it.
const title = ipad ? f.title.replace(/<br>/g, " ") : f.title;
document.getElementById("copy").innerHTML =
  `<div class="kicker"><img src="../../Kotek/Resources/Assets.xcassets/kipli-happy.imageset/kipli-happy.svg" alt=""><span>${f.kicker}</span></div>` +
  `<h1>${title}</h1><p>${f.body}</p>${f.extra || ""}`;
document.getElementById("shot").src = (ipad ? "../screenshots/ipad-13/" : "../screenshots/iphone-6.9/") + f.shot;
</script>
</body>
</html>
